# Cargo workspace for the Rust components that link into the seekdb
# (OceanBase-lite) C++ server. Add new crates under `members`.
[workspace]
resolver = "2"
members = ["config", "kv", "local", "sql-nio", "file-sql"]

# The `release` profile is what gets linked into the server build
# (CMAKE_BUILD_TYPE != Debug maps to `cargo build --release`).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true        # keep symbols; seekdb's default build is RelWithDebInfo
# Rust static libraries share one panic runtime in the final executable. Keep
# them consistent so File SQL can catch decoder panics from malformed input.
# File SQL catches internally; the other extern "C" / cxx boundaries abort on
# an escaping panic, so no panic may unwind into C++.
panic = "unwind"

# The profile CMake Debug builds link (cmake/Rust.cmake). Same dev-profile
# codegen and the same guarded panic behavior as Release.
[profile.cmake-debug]
inherits = "dev"
panic = "unwind"
